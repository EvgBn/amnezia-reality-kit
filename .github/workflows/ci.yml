name: ci

on:
  push:
  pull_request:

jobs:
  unit-test-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast shell tests
        run: make unit-test-shell

  unit-test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        run: make unit-test-integration

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: containers/amneziawg/go.sum
      - name: udp-relay Go tests
        run: make test-go

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Shellcheck test harness
        run: shellcheck -x tests/lib/*.sh tests/fixtures/**/*.sh
